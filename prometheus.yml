global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # API gateway
  - job_name: "claim-api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]

  # Agent 1 and Agent 2: DNS discovery finds every replica, so
  # `--scale agent-worker=3` is scraped without changing this file.
  - job_name: "classifier-agent"
    dns_sd_configs:
      - names: ["classifier-agent"]
        type: A
        port: 9100

  - job_name: "agent-worker"
    dns_sd_configs:
      - names: ["agent-worker"]
        type: A
        port: 9100

  # Redis liveness is covered by its Compose health check; Prometheus self-monitoring:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Optional per-container CPU/memory (docker compose --profile resources up -d)
  - job_name: "cadvisor"
    dns_sd_configs:
      - names: ["cadvisor"]
        type: A
        port: 8080
